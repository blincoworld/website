<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>Payment received | TradeOS</title>

  <style>
    body {
      margin: 0;
      background: #f5f7fb;
      color: #10213d;
      font-family:
        Inter,
        ui-sans-serif,
        system-ui,
        sans-serif;
    }

    .card {
      width: min(100% - 32px, 680px);
      margin: 10vh auto;
      padding: 42px;
      border: 1px solid #dce3ed;
      border-radius: 18px;
      background: #fff;
      box-shadow:
        0 15px 40px rgba(20,39,74,.07);
      text-align: center;
    }

    .tick {
      display: grid;
      place-items: center;
      width: 54px;
      height: 54px;
      margin: 0 auto 20px;
      border-radius: 50%;
      background: #dcfce7;
      color: #166534;
      font-size: 26px;
      font-weight: 900;
    }

    h1 {
      margin: 0 0 12px;
      font-size: 36px;
    }

    p {
      margin: 0;
      color: #637086;
      font-size: 17px;
      line-height: 1.65;
    }
  </style>
</head>

<body>
  <main class="card">
    <div class="tick">✓</div>

    <h1>Payment received.</h1>

    <p>
      You're in. Your payment has been received
      securely and I'll be in touch with the next
      steps for your TradeOS founding-member build.
    </p>
  </main>
</body>
</html>
